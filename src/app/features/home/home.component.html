<div class="min-vh-100 bg-gradient d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg border-0 rounded-3 overflow-hidden">
          <div class="card-body p-5 text-center">
            <div class="mb-4">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                class="text-success"
                style="width: 64px; height: 64px"
              >
                <path
                  d="M12 22C6.477 22 2 17.523 2 12s4.477-10 10-10 10 4.477 10 10-4.477 10-10 10zm0-1.5a8.5 8.5 0 100-17 8.5 8.5 0 000 17z"
                  fill="currentColor"
                />
              </svg>
            </div>

            <h1 class="display-5 fw-bold mb-3">Angul-It Captcha</h1>

            <p class="lead text-secondary mb-4">
              Verify that you are human by completing security challenges
            </p>

            <div class="alert alert-light border border-secondary-subtle rounded-2 text-start mb-4">
              <div class="fw-semibold text-secondary mb-2">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  style="width: 18px; height: 18px; display: inline-block; margin-right: 8px; vertical-align: -2px"
                >
                  <circle cx="12" cy="12" r="10" />
                  <text x="12" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="white">i</text>
                </svg>
                Instructions
              </div>
              <ul class="mb-0 small text-secondary">
                <li>Complete all 3 verification challenges</li>
                <li>Select images, solve puzzles, or enter text</li>
                <li>Your progress is saved automatically</li>
              </ul>
            </div>

            <button
              (click)="startChallenge()"
              class="btn btn-success btn-lg px-5 fw-semibold rounded-2 w-100"
            >
              Start Verification
            </button>
          </div>

          <div class="card-footer bg-light border-0 text-center py-3">
            <small class="text-secondary">
              Protected by Angul-It Security &copy; 2026
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
