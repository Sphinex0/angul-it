<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg text-center p-4" style="max-width: 600px;">
    
    <div class="card-body">
      <div class="mb-4 text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 6.22 6.22 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"/>
        </svg>
      </div>

      <h1 class="card-title display-5 fw-bold mb-3">Angul-It Captcha</h1>
      
      <p class="card-text lead text-muted mb-4">
        Are you a Robot ?
      </p>

      <div class="alert alert-info text-start" role="alert">
        <strong><i class="bi bi-info-circle"></i> Instructions:</strong>
        <ul class="mb-0 mt-1">
          <li>Complete all verification stages.</li>
          <li>Select images, solve puzzles, or enter text.</li>
          <li><del>Do not refresh the page during the challenge.</del></li>
        </ul>
      </div>

      <button (click)="startChallenge()" class="btn btn-primary btn-lg w-100 mt-3">
        I'm not a robot!
      </button>
      
    </div>
    
    <div class="card-footer text-muted border-0 bg-transparent">
      Protected by me &copy; 2026
    </div>
  </div>
</div>
