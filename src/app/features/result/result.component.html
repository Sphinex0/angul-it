<div class="min-vh-100 bg-light d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg border-0 rounded-3 overflow-hidden text-center">
          <div class="card-body p-5">
            <div class="mb-4">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="text-success"
                style="width: 80px; height: 80px"
              >
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"
                />
              </svg>
            </div>

            <h1 class="display-4 fw-bold mb-2">Verification Successful!</h1>

            <p class="lead text-secondary mb-4">
              You have proven that you are human
            </p>

            <div class="alert alert-success bg-success bg-opacity-10 border border-success border-opacity-25 rounded-2 mb-4">
              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                class="text-success"
                style="width: 20px; height: 20px; display: inline-block; margin-right: 8px; vertical-align: -2px"
              >
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" />
              </svg>
              <span class="fw-semibold">
                Completed in {{ (duration() / 1000).toFixed(1) }} seconds
              </span>
            </div>

            <button (click)="restart()" class="btn btn-success btn-lg px-5 fw-semibold rounded-2 w-100">
              Start Another Session
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
