<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow text-center p-5 border-success" style="max-width: 500px;">

    <div class="mb-4 text-success">
      <i class="bi bi-check-circle-fill display-1"></i>
    </div>

    <h1 class="mb-3">Verification Complete</h1>

    <p class="lead text-muted mb-4">
      You have successfully proven you are human.
      <br>
      <span class="small">You took: {{ (duration() / 1000)}} seconds</span>
    </p>


    <button (click)="restart()" class="btn btn-outline-success btn-lg">
      Verify Another Session
    </button>

  </div>
</div>
