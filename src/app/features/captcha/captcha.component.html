<div class="bg-light min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="progress mb-4" style="height: 6px">
          <div
            class="progress-bar bg-success"
            role="progressbar"
            [style.width.%]="(currentStageIndex() + 1) * 33"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-header bg-white border-bottom-0 pt-5 pb-3">
            <h3 class="card-title text-center fw-bold mb-1">Security Verification</h3>
            <p class="text-center text-secondary small mb-0">
              Challenge {{ currentStageIndex() + 1 }}
            </p>
          </div>

          <div class="card-body p-4">
            <div class="alert alert-info border-0 mb-4">
              <div class="text-center fw-semibold">
                {{ currentStage().prompt }}
              </div>
            </div>

            @if (currentStage(); as stage) {
              @switch (stage.type) {
                @case ('image') {
                  <app-image-grid
                    [data]="stage.data"
                    [initialSelection]="currentAnswer() || []"
                    (selectionChange)="onSelectionChange($event)"
                  ></app-image-grid>
                }
                @case ('text') {
                  <app-text-input
                    [data]="stage.data"
                    [initialAnswer]="currentAnswer() || ''"
                    (answerChange)="onSelectionChange($event)"
                  ></app-text-input>
                }
                @case ('slide') {
                  <app-slider-captcha
                    [data]="stage.data"
                    [initialAnswer]="currentAnswer() || ''"
                    (answerChange)="onSelectionChange($event)"
                  ></app-slider-captcha>
                }
              }
            }
          </div>

          <div class="card-footer bg-white border-top pt-3 pb-4">
            <div class="d-flex justify-content-between gap-2">
              @if (currentStageIndex() > 0) {
                <button class="btn btn-outline-secondary px-4" (click)="handlePrev()">Back</button>
              }
              <div class="flex-grow-1"></div>
              <button class="btn btn-success px-5" [disabled]="!isValid" (click)="handleNext()">
                Next
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
