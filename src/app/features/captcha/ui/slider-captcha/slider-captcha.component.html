<div class="slider-container">
  <div class="card shadow-sm border-0 rounded-2">
    <div class="card-body p-3">
      <svg
        viewBox="0 0 300 150"
        class="w-100 d-block bg-light rounded"
        preserveAspectRatio="xMidYMid meet"
        style="min-height: 150px"
      >
        <defs>
          <clipPath id="puzzle-clip">
            <path [attr.d]="puzzlePath" />
          </clipPath>
          <filter id="shadow">
            <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.5" />
          </filter>
        </defs>

        <image [attr.href]="data().src" width="300" height="150" preserveAspectRatio="none" />

        <g [attr.transform]="'translate(' + targetX() + ',' + targetY() + ')'">
          <path
            [attr.d]="puzzlePath"
            fill="rgba(0,0,0,0.5)"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="1"
          />
        </g>

        <g
          [attr.transform]="'translate(' + sliderValue() + ',' + targetY() + ')'"
          filter="url(#shadow)"
        >
          <g clip-path="url(#puzzle-clip)">
            <image
              [attr.href]="data().src"
              width="300"
              height="150"
              preserveAspectRatio="none"
              [attr.x]="-targetX()"
              [attr.y]="-targetY()"
            />
          </g>
          <path [attr.d]="puzzlePath" fill="none" stroke="white" stroke-width="2" />
        </g>
      </svg>
    </div>

    <div class="card-footer bg-white border-0 p-4">
      <input
        type="range"
        class="form-range"
        min="0"
        max="240"
        [formControl]="sliderControl"
        (change)="onRelease()"
        aria-label="Puzzle slider"
      />
      <p class="text-center text-secondary small mt-3 mb-0">
        Drag to match the puzzle piece
      </p>
    </div>
  </div>
</div>
